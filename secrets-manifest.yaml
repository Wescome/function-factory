# secrets-manifest.yaml — Function Factory Secret Inventory
#
# INV-DEVOPS-6: Rollbacks to a version where secrets differ require
# --confirm-secret-change. This manifest enables the rollback script to
# diff secrets between versions.
#
# Rotation runbook: docs/runbooks/RUNBOOK-2-secret-rotation.md (Runbook-2)
# Last reviewed: 2026-06-03

# ── ff-pipeline Worker ────────────────────────────────────────────────────────
worker: ff-pipeline
secrets:
  - name: ARANGO_URL
    description: ArangoDB cluster URL (ff-arango service)
    sensitivity: high
    rotation_period_days: 180
    owner: infrastructure
    used_by: [ff-pipeline, ff-arango]

  - name: ARANGO_DATABASE
    description: ArangoDB database name
    sensitivity: medium
    rotation_period_days: never
    owner: infrastructure
    used_by: [ff-pipeline, ff-arango]

  - name: ARANGO_JWT
    description: ArangoDB JWT auth token
    sensitivity: high
    rotation_period_days: 90
    owner: infrastructure
    used_by: [ff-pipeline, ff-arango]

  - name: OFOX_API_KEY
    description: ofox.ai API key for LLM routing
    sensitivity: high
    rotation_period_days: 90
    owner: ai-team
    used_by: [ff-pipeline]

  - name: CF_API_TOKEN
    description: Cloudflare API token (read-only for version metadata)
    sensitivity: high
    rotation_period_days: 365
    owner: infrastructure
    used_by: [ff-pipeline]

  - name: GITHUB_TOKEN
    description: Read-only GitHub token for pi-coding-agent (scope: contents:read)
    sensitivity: high
    rotation_period_days: 90
    owner: infrastructure
    used_by: [ff-pipeline]
    invariant: INV-DEVOPS-4 — must NOT have write or merge scope

  - name: OPERATOR_CONTROL_TOKEN
    description: Bearer token for operator control endpoints (fence, restart, etc.)
    sensitivity: high
    rotation_period_days: 90
    owner: infrastructure
    used_by: [ff-pipeline, CI-smoke-test]

  - name: GAS_CITY_BEARER_TOKEN
    description: Bearer token for Gas City API calls from ff-pipeline
    sensitivity: high
    rotation_period_days: 90
    owner: infrastructure
    used_by: [ff-pipeline]
    note: shared value with GC_SUPERVISOR_TOKEN on gascity-supervisor

  - name: GAS_CITY_HMAC_SECRET_V1
    description: HMAC secret for Gas City webhook signatures
    sensitivity: high
    rotation_period_days: 90
    owner: infrastructure
    used_by: [ff-pipeline, gascity-supervisor]

# ── gascity-supervisor Worker ─────────────────────────────────────────────────
worker: gascity-supervisor
secrets:
  - name: GC_SUPERVISOR_TOKEN
    description: Bearer token for inbound requests to gascity-supervisor
    sensitivity: high
    rotation_period_days: 90
    owner: infrastructure
    used_by: [gascity-supervisor, ff-pipeline, CI-smoke-test]
    note: shared value with GAS_CITY_BEARER_TOKEN on ff-pipeline

  - name: ANTHROPIC_API_KEY
    description: Anthropic API key for agents running inside Gas City sessions
    sensitivity: high
    rotation_period_days: 90
    owner: ai-team
    used_by: [gascity-supervisor]

# ── Rotation procedure (Runbook-2) ────────────────────────────────────────────
# See docs/runbooks/RUNBOOK-2-secret-rotation.md for step-by-step.
# Key steps:
# 1. Generate new secret value
# 2. Run: wrangler secret put <SECRET_NAME> --env production
# 3. Verify: curl the relevant health endpoint to confirm new value is active
# 4. If rollback needed: wrangler secret put <SECRET_NAME> (restore old value)
#    If secret value changed since the rolled-back version, you MUST pass
#    --confirm-secret-change to the rollback script (INV-DEVOPS-6).
# 5. Update this manifest's last_reviewed date
