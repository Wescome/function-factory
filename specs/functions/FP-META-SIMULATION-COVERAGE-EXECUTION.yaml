id: FP-META-SIMULATION-COVERAGE-EXECUTION
source_refs:
  - BC-META-ENFORCE-SIMULATION-COVERAGE
  - PRS-META-SIMULATION-COVERAGE
explicitness: explicit
rationale: >
  Execution Function for Fidelity Verification. Runs the produced code's test suite
  and scenarios against the Executable Specification's invariants. Consumes FidelityVerificationInput.
  Produces a verdict: accepted or rejected.

type: execution
capability_ref: BC-META-ENFORCE-SIMULATION-COVERAGE

inputs:
  - FidelityVerificationInput (normalized evidence bundle from Stage 6 evidence Function)
  - Executable Specification (the specification that defines invariants and validations)

outputs:
  - FidelityVerificationVerdict (accepted / rejected / needs_remediation)
  - Per-invariant scenario coverage results

governing_constraints:
  - Fail-closed: insufficient scenario coverage = rejected (whitepaper §6.3)
  - Consumes FidelityVerificationInput ONLY — never reads raw Stage6TraceLog directly
  - The Verification Evaluator has no discretion (ConOps §3.4) — applies coverage formulas deterministically
  - Scenario coverage: every invariant must have ≥1 passing scenario
  - Required validation pass rate: configurable threshold, default 100% for required validations

candidate_invariants:
  - Fidelity Verification writes a Verification Report on every invocation (pass or fail)
  - Fidelity Verification never promotes a Function without scenario coverage proof
  - The verdict is deterministic given the same FidelityVerificationInput

success_signals:
  - A Function produced by Stage 6 enters Fidelity Verification and receives a verdict
  - Rejected Functions have specific remediation guidance (which invariants lack coverage)
  - Accepted Functions transition to 'verified' lifecycle state
