id: FP-META-SIMULATION-COVERAGE-EVIDENCE
source_refs:
  - BC-META-ENFORCE-SIMULATION-COVERAGE
  - PRS-META-SIMULATION-COVERAGE
explicitness: explicit
rationale: >
  Evidence Function for Fidelity Verification. Captures the proof that Fidelity Verification ran and
  what it found. Produces a Verification Report (Fidelity Verification variant) that enters
  the lineage graph and is consumed by downstream trust computation.

type: evidence
capability_ref: BC-META-ENFORCE-SIMULATION-COVERAGE

inputs:
  - FidelityVerificationVerdict from execution Function
  - Per-invariant scenario results from execution Function

outputs:
  - FidelityVerificationVerificationReport (at specs/verification-reports/VR-<IS-ID>-FIDELITY-<timestamp>.yaml)

governing_constraints:
  - Verification Report emitted on every Fidelity Verification invocation (pass or fail)
  - Report carries per-invariant detail: which scenarios ran, which passed, which failed
  - Failed scenarios name the specific invariant and the specific test that failed
  - Report carries lineage (source_refs cites FidelityVerificationInput + Intent Specification)

candidate_invariants:
  - No Fidelity Verification invocation completes without a persisted Verification Report
  - Verification Reports are immutable once written
  - Reports are queryable for downstream trust computation

success_signals:
  - Every Fidelity Verification invocation produces a Verification Report at the expected path
  - Reports parse against the Verification Report Zod schema
  - Downstream trust computation can read Fidelity Verification reports without additional transformation
