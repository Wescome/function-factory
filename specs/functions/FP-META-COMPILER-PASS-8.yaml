id: FP-META-COMPILER-PASS-8
source_refs:
  - BC-META-COMPILER-PASS-8
  - PRS-META-COMPILER-PASS-8
  - SIG-META-WHITEPAPER-V4
explicitness: explicit
rationale: >
  First Function derived from BC-META-COMPILER-PASS-8. Scoped as the
  terminal compiler pass — takes validated intermediates and a passing
  Coherence Verification Verification Report, produces a Executable Specification on disk. Node-type
  inference, edge derivation, and lineage preservation are all inside
  scope because they are the mechanics of assembly. What is deliberately
  outside scope- Executable Specification execution (Stage 6), Executable Specification optimization
  (future compiler pass), cross-Executable Specification linking (future Stage 5
  enrichment). This is an execution Function per whitepaper §3.2 — the
  first execution Function the Factory has emitted; it runs during
  compile time and its output is the input to the next stage.

capabilityId: BC-META-COMPILER-PASS-8
name: assemble_executable-specification
purpose: >
  Assemble compiler intermediates (atoms, contracts, invariants,
  dependencies, validations) plus a passing Coherence Verification Verification Report into
  a Executable Specification conforming to the Executable Specification Zod schema, emitted to disk at
  specs/executable-specifications/.
functionType: execution

expectedInputs:
  - RequirementAtom[] from Pass 1
  - Contract[] from Pass 2
  - Invariant[] from Pass 3
  - Dependency[] from Pass 4
  - ValidationSpec[] from Pass 5
  - CoherenceVerificationReport with overall=pass from Pass 7
  - IntentSpecificationDraft for lineage and the functionId association

expectedOutputs:
  - Executable Specification artifact written to specs/executable-specifications/ES-<IS-ID>.yaml
  - Executable Specification return value for in-process callers (compiler orchestration, tests)

governingConstraints:
  - Fail-closed — Pass 8 refuses to run if the Coherence Verification Verification Report's overall verdict is not pass
  - Determinism — identical validated intermediates produce byte-identical Executable Specifications modulo the id and emission timestamp
  - Lineage preservation — every node cites the intermediate(s) it derived from; every edge cites the dependency or covers-relationship that justified it
  - Schema conformance — the emitted Executable Specification validates against the Executable Specification Zod schema
  - Idempotency — rerunning Pass 8 against the same intermediates overwrites the Executable Specification on disk with byte-identical content (no duplicate emission, no append-only behavior)

candidateInvariants:
  - A Executable Specification is emitted only when the Coherence Verification Verification Report cited as source has overall=pass
  - Every node in the emitted Executable Specification has source_refs citing at least one Pass 1–5 intermediate
  - Every edge endpoint resolves to a node present in the same Executable Specification
  - The Executable Specification id follows ES-<IS-ID> format exactly; no timestamp suffix, because unlike Verification Reports the Executable Specification is not append-only per Intent Specification

successSignals:
  - Coherence Verification Verification Report determinism assertions continue to hold when the full compile (including Pass 8) is replayed quarterly
  - Stage 6 harness execution accepts Pass 8 Executable Specifications without out-of-band transformation
  - Bootstrap recompile (compile IS-META-COHERENCE-VERIFICATION through Passes 0–8) produces both a Verification Report and a Executable Specification

confidence: 0.85
