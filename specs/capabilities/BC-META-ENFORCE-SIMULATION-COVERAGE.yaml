id: BC-META-ENFORCE-SIMULATION-COVERAGE
source_refs:
  - PRS-META-SIMULATION-COVERAGE
  - PRS-META-THREE-VERIFICATION-FAMILIES
  - SIG-META-FIDELITY-REACHABLE
explicitness: explicit
rationale: >
  Fidelity Verification Function under the canonical Capability BC-META-ENFORCE-COVERAGE-
  GATES from factory-meta/SKILL.md rule 4. Scoped specifically to
  simulation coverage (Fidelity Verification per whitepaper §6.3). Coherence Verification (compile
  coverage) is already implemented. Persistence Verification (assurance/continuous) is
  deferred until Functions reach 'monitored'. Fidelity Verification is now reachable
  because Stage 6 produces FidelityVerificationInput bundles. Per whitepaper §3 Stage 3
  guardrail #2, each Capability yields execution/control/evidence triple.

name: Enforce simulation coverage on produced code before lifecycle promotion
description: >
  The Factory's durable ability to evaluate whether code produced by Stage 6
  satisfies the specification's invariants and scenarios before the Function
  transitions from 'implemented' to 'verified'. Fidelity Verification consumes FidelityVerificationInput
  (the normalized evidence bundle from Stage 6's evidence Function) and
  produces a Verification Report with per-invariant scenario results, required
  validation pass rate, and a fail-closed verdict.

  Fidelity Verification does NOT read raw Stage6TraceLogs — it reads FidelityVerificationInput only.
  This is the contract boundary: Stage 6 produces evidence; Fidelity Verification
  evaluates it. The ACL (handToFidelityVerification / execution_bundleEvidenceForAcceptanceReview)
  normalizes Stage 6 output into Fidelity Verification input.

yields:
  execution: FP-META-SIMULATION-COVERAGE-EXECUTION
  control: FP-META-SIMULATION-COVERAGE-CONTROL
  evidence: FP-META-SIMULATION-COVERAGE-EVIDENCE
