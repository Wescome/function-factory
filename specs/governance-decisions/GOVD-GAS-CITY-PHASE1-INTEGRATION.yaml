      D-NEW-2 (FormulaCompilation approved) must be amended: the FORM-* artifact
      captures parametric specification (template_name + version_hash + vars +
      prompts_resolved), NOT raw TOML substrate. The TOML substrate is operator-managed
      config. Tier conversion remains procedural→procedural. Lineage edge: compiled_from EP-*.
