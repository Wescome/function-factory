observation: >
  Stage 6 (function synthesis) produces code, tests, and evidence artifacts
  (Stage6TraceLog, CandidateSelectionReport, FidelityVerificationInput). Fidelity Verification is
  specified in whitepaper §6.3 as the Simulation Verification that runs
  before a Function transitions from 'implemented' to 'verified'. The
  FidelityVerificationInput schema exists (ratified-decisions.md lines 488-528). The
  evidence Function emits FidelityVerificationInput bundles. But no Fidelity Verification evaluator
  exists to consume them. Every Function produced by Stage 6 is stuck at
  lifecycle state 'implemented' indefinitely — the same pattern that
  motivated the FUNCTION-SYNTHESIS Pressure, one stage downstream.

  Whitepaper §11 non-negotiable #6: "A Factory without Fidelity Verification promotes
  Functions to monitored before their scenarios cover their invariants."
  Fidelity Verification must exist in v1. It is now reachable (Stage 6 produces its
  input) and therefore its absence is an active gap, not a deferred one.
