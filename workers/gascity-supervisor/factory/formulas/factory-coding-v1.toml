description = """
Factory-managed coding workflow. Dispatched by the Function Factory Formula
Compiler (IP-1) via the three-call HTTP sequence (version probe → bead create
→ sling attach).

This formula is parametric: per-dispatch variation is expressed entirely via
the sling vars map. The template TOML is operator-deployed at city-init and
never modified per-dispatch.

## Roles

Three roles execute sequentially:

1. **Planner** — reads the Executable Specification and produces a coding plan
   (approach, file list, acceptance check list).
2. **Coder** — implements the plan in the rig's working directory.
3. **Verifier** — reviews the implementation against the ES acceptance criteria
   and either approves or files a REVISE finding.

After Verifier approves, the RELEASE step signals Factory via HTTP POST.

## Working directory

All role steps operate from `{{rig_root}}`. `gc prime` is called at the start
of each step to anchor the session.

## Lineage labels

Every step declares the five Factory lineage labels so that molecule-internal
beads carry the same lineage as the root bead. Labels do NOT propagate from
the root bead to child beads automatically — they must be declared on each
`[[steps]]` block. This is a Gas City architecture invariant (UE-Q1C-2).

## Convergence

`max_iterations = {{max_iterations}}`. After Verifier returns REVISE, the
molecule re-enters at the Coder step (not Planner). Convergence is tracked by
the Factory via the RELEASE callback; Gas City handles execution continuity.

## RELEASE step

The final step POSTs to `{{ff_webhook_url}}` with an HMAC-SHA256 signature
computed from `GAS_CITY_HMAC_SECRET` (env var on the Gas City host). The
keyid is `{{ff_webhook_hmac_keyid}}`. Factory uses the signature to verify
authenticity before triggering Fidelity Verification (IP-3).

Read each step's description before acting. Config values in vars override
this header text."""
formula = "factory-coding-v1"
version = 3
contract = "graph.v2"

[vars]

[vars.fn_id]
description = "Factory Function ID (FN-*)"
required = true

[vars.is_id]
description = "Factory Intent Specification ID (IS-*)"
required = true

[vars.es_id]
description = "Factory Executable Specification ID (ES-*)"
required = true

[vars.ep_id]
description = "Factory Execution Packet ID (EP-* or TEP-* during prefix transition)"
required = true

[vars.form_id]
description = "Factory Formula Instance ID (FORM-*)"
required = true

[vars.factory_attempt]
description = "Dispatch attempt counter (stringified decimal, 1-indexed)"
required = true

[vars.ff_webhook_url]
description = "Factory webhook URL for the RELEASE step POST (IP-4 handler)"
required = true

[vars.ff_webhook_hmac_keyid]
description = "HMAC key ID used to sign the RELEASE step POST body"
default = "v1"

[vars.rig_root]
description = "Working directory root path for all role steps"
required = true

[vars.max_iterations]
description = "Maximum Coder/Verifier convergence cycles before hard failure"
default = "5"

[vars.parameters_json]
description = "JSON-encoded EP adapter executionRequest.parameters blob"
required = true

[vars.planner_prompt]
description = "Planner role instruction (from EP.roles[roleId=planner].instruction)"
required = true

[vars.planner_inputs]
description = "Planner role inputs as JSON array (EP.roles[roleId=planner].inputs)"
default = "[]"

[vars.planner_outputs]
description = "Planner role outputs as JSON array (EP.roles[roleId=planner].outputs)"
default = "[]"

[vars.coder_prompt]
description = "Coder role instruction (from EP.roles[roleId=coder].instruction)"
required = true

[vars.coder_inputs]
description = "Coder role inputs as JSON array (EP.roles[roleId=coder].inputs)"
default = "[]"

[vars.coder_outputs]
description = "Coder role outputs as JSON array (EP.roles[roleId=coder].outputs)"
default = "[]"

[vars.verifier_prompt]
description = "Verifier role instruction (from EP.roles[roleId=verifier].instruction)"
required = true

[vars.verifier_inputs]
description = "Verifier role inputs as JSON array (EP.roles[roleId=verifier].inputs)"
default = "[]"

[vars.verifier_outputs]
description = "Verifier role outputs as JSON array (EP.roles[roleId=verifier].outputs)"
default = "[]"

[vars.workspace_url]
description = "Presigned/signed URL to download workspace skeleton tar.gz from R2"
required = true

[vars.skeleton_sha]
description = "Git SHA of the main branch snapshot used for skeleton (first 12 chars)"
default = "unknown"


[[steps]]
id = "init"
title = "Init workspace — {{fn_id}}"
# Non-LLM workspace hydration. Runs before any agent step.
runtime_requirements = ["command_exec"]
tags = [
  "fn-id:{{fn_id}}",
  "is-id:{{is_id}}",
  "es-id:{{es_id}}",
  "form-id:{{form_id}}",
  "factory-attempt:{{factory_attempt}}",
]
description = """
Hydrate {{rig_root}} from the Factory skeleton snapshot before the agent fires.

```bash
set -euo pipefail
mkdir -p {{rig_root}}
curl -fsSL "{{workspace_url}}" | tar -xz --strip-components=1 -C {{rig_root}}
cd {{rig_root}}
git init -q
git add -A
git commit -q -m "seed: {{fn_id}} @ {{skeleton_sha}}"
echo "[workspace-init] baseline commit ready — $(git log --oneline -1)"
```

Exit 0 on success. Non-zero exit halts the Convoy — emit DIV-SEED-INIT-FAILURE to Coordinator.
"""

[[steps]]
id = "plan"
needs = ["init"]
title = "Plan — {{fn_id}} attempt {{factory_attempt}}"
# AC-REG2/AC-REG6: planner needs AI reasoning + workspace write scope.
runtime_requirements = ["ai_reasoning", "model_routing", "workspace_write_scope"]
tags = [
  "fn-id:{{fn_id}}",
  "is-id:{{is_id}}",
  "es-id:{{es_id}}",
  "form-id:{{form_id}}",
  "factory-attempt:{{factory_attempt}}",
]
description = """
**Factory lineage:** fn={{fn_id}} is={{is_id}} es={{es_id}} ep={{ep_id}} form={{form_id}} attempt={{factory_attempt}}

**Working directory:** `{{rig_root}}`

**Execution parameters:**
```json
{{parameters_json}}
```

**Expected inputs:** {{planner_inputs}}
**Expected outputs:** {{planner_outputs}}

---

{{planner_prompt}}

---

**Exit criteria:**
- Written a concrete coding plan to a file in `{{rig_root}}` (e.g. `PLAN.md`).
- The plan names every file to be created or modified and the acceptance
  criterion each change addresses.
- Close this step when the plan file is written and committed (if applicable).
"""

[[steps]]
id = "code"
title = "Code — {{fn_id}} attempt {{factory_attempt}}"
needs = ["plan"]
# AC-REG2/AC-REG6: coder needs AI reasoning + workspace write scope + contract eval + tool probe.
runtime_requirements = ["ai_reasoning", "model_routing", "workspace_write_scope", "contract_evaluation", "tool_capability_probe"]
tags = [
  "fn-id:{{fn_id}}",
  "is-id:{{is_id}}",
  "es-id:{{es_id}}",
  "form-id:{{form_id}}",
  "factory-attempt:{{factory_attempt}}",
]
description = """
**Factory lineage:** fn={{fn_id}} is={{is_id}} es={{es_id}} ep={{ep_id}} form={{form_id}} attempt={{factory_attempt}}

**Working directory:** `{{rig_root}}`

**Expected inputs:** {{coder_inputs}}
**Expected outputs:** {{coder_outputs}}

---

{{coder_prompt}}

---

**Exit criteria:**
- All acceptance criteria in the Executable Specification are implemented.
- Tests pass (if applicable to this domain).
- Implementation artifacts are committed/saved in `{{rig_root}}`.
- Close this step when the implementation is complete and ready for verification.
"""

[[steps]]
id = "verify"
title = "Verify — {{fn_id}} attempt {{factory_attempt}}"
needs = ["code"]
# AC-REG2/AC-REG6: verifier needs AI reasoning + contract evaluation.
runtime_requirements = ["ai_reasoning", "model_routing", "contract_evaluation"]
tags = [
  "fn-id:{{fn_id}}",
  "is-id:{{is_id}}",
  "es-id:{{es_id}}",
  "form-id:{{form_id}}",
  "factory-attempt:{{factory_attempt}}",
]
description = """
**Factory lineage:** fn={{fn_id}} is={{is_id}} es={{es_id}} ep={{ep_id}} form={{form_id}} attempt={{factory_attempt}}

**Working directory:** `{{rig_root}}`

**Expected inputs:** {{verifier_inputs}}
**Expected outputs:** {{verifier_outputs}}

---

{{verifier_prompt}}

---

**Exit criteria — choose ONE:**

**If APPROVED:** Every acceptance criterion passes. Evidence is complete.
Close this step and proceed to RELEASE.

**If REVISE (up to {{max_iterations}} total attempts):** One or more criteria
fail. Write a REVISE finding to `{{rig_root}}/REVISE-{{factory_attempt}}.md`
with the failing criteria and specific defects. Do NOT close this step yet —
signal the finding in a bead note, then close. The next attempt will
re-enter at the Code step.
"""

[[steps]]
id = "release"
title = "Release — signal Factory completion for {{fn_id}}"
needs = ["verify"]
# AC-REG2: release step runs the fidelity shell script; needs command exec only.
runtime_requirements = ["command_exec", "file_materialize"]
tags = [
  "fn-id:{{fn_id}}",
  "is-id:{{is_id}}",
  "es-id:{{es_id}}",
  "form-id:{{form_id}}",
  "factory-attempt:{{factory_attempt}}",
]
# Lineage metadata required by harness_fidelity.go — reads gc.fn_id, gc.ff_webhook_url
# etc. from bead metadata (not labels). The metadata field copies directly to bead metadata.
[steps.metadata]
"gc.fn_id" = "{{fn_id}}"
"gc.is_id" = "{{is_id}}"
"gc.es_id" = "{{es_id}}"
"gc.ep_id" = "{{ep_id}}"
"gc.form_id" = "{{form_id}}"
"gc.factory_attempt" = "{{factory_attempt}}"
"gc.ff_webhook_url" = "{{ff_webhook_url}}"
"gc.ff_webhook_hmac_keyid" = "{{ff_webhook_hmac_keyid}}"
"gc.rig_root" = "{{rig_root}}"
description = """
**Factory lineage:** fn={{fn_id}} is={{is_id}} es={{es_id}} ep={{ep_id}} form={{form_id}} attempt={{factory_attempt}}

Signal Factory that this execution is complete. Factory will run Fidelity
Verification (IP-3) on receipt.

The outcome is NOT decided here by a heuristic. It is computed by the Gas City
fidelity validator (IS-GC-FIDELITY-VALIDATION) — a deterministic, no-LLM pure
function of the provider response envelope, the step type, and the prior step
verdicts. The validator produces exactly one verdict (`approved` | `revise`),
builds the exact RELEASE payload the Factory webhook accepts (bare-integer
`factory_attempt`, fixed field order, HMAC over the raw bytes), and decides
whether to re-run the molecule, emit the RELEASE webhook, or fail closed.

**1. Assemble the fidelity job from the molecule's evidence.**

The provider evidence for each step (response envelope: `status`,
`artifact_manifest`, `policy_events`, plus the domain-adapter-normalized
per-step evidence in `step_outputs` — e.g. `patch_diff`,
`patch_applies_cleanly`, `verifier_report_present`, `verifier_accepts`,
`tests_section_present`, `final_matches_verified`, `patch_model_id`,
`verify_model_id`) and the prior step verdicts MUST be written to
`{{rig_root}}/fidelity-job.json` in the validator's job shape. The validator is
domain-neutral: which per-step-type checks run is decided by
`factory/fidelity-checks.toml` (the per-step-type check table, matched against
`step_name` by regex), NOT by the validator code. `is_release_step` marks the
molecule's terminator step (the one that emits the RELEASE webhook). The lineage
and loop fields come from the formula vars already substituted here:

```json
{
  "step_name": "release",
  "is_release_step": true,
  "lineage": {
    "fn_id": "{{fn_id}}",
    "is_id": "{{is_id}}",
    "es_id": "{{es_id}}",
    "ep_id": "{{ep_id}}",
    "form_id": "{{form_id}}",
    "factory_attempt": {{factory_attempt}},
    "bead_id": "$GC_BEAD_ID"
  },
  "declared_outputs": [ ... ],
  "prior_step_verdicts": [ ... ],
  "response": { ... the provider response envelope for the molecule ... },
  "convergence": { "max_amendment_depth": {{max_iterations}} },
  "webhook": {
    "url": "{{ff_webhook_url}}",
    "hmac_secret": "$GAS_CITY_HMAC_SECRET",
    "key_id": "{{ff_webhook_hmac_keyid}}"
  }
}
```

`factory_attempt` is emitted as a BARE JSON INTEGER here (no quotes) — the
validator and the Factory schema both require `Number.isInteger`. Do not quote
it.

**2. Run the validator + RELEASE driver.**

The driver reads the job, runs the deterministic validator, and acts on the
verdict: it POSTs the signed RELEASE payload (retrying once on non-2xx,
FV-22), re-enters the molecule on a re-runnable `revise`, or POSTs a
`molecule.failed` event if evidence is absent/malformed (fail-closed, FV-20).

```bash
export GC_BEAD_ID FN_ID="{{fn_id}}" GAS_CITY_HMAC_SECRET
export FF_WEBHOOK_URL="{{ff_webhook_url}}"
export FF_WEBHOOK_HMAC_KEYID="{{ff_webhook_hmac_keyid}}"
export RIG_ROOT="{{rig_root}}"

# Ensure all agent-written files are staged for diff capture (INV-SEED-3)
cd {{rig_root}} && git add -A

bash /data/cities/factory/fidelity/fidelity-release.sh
RC=$?
```

Driver exit codes:
- `0`  — RELEASE POSTed and accepted (200/202); the bead is already closed.
- `10` — verdict was a re-runnable `revise`; the molecule re-enters at the
  Code step as attempt N+1 (formula `max_iterations = {{max_iterations}}`
  governs the loop). The remediation is persisted to
  `{{rig_root}}/REMEDIATION-<next>.md` for the next attempt to inject.
- `20` — fail-closed: a `molecule.failed` event was POSTed and the bead was
  closed `--status=blocked`. Factory's operational sweeper picks it up.

**Exit criteria:** the driver exited 0 (RELEASE accepted) or 10 (molecule
re-entering) or 20 (fail-closed event emitted). On 0 the bead is closed by the
driver; do not double-close.
"""
