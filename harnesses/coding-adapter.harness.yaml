nlahspec: "0.1"
lineage:
  source_refs: [IS-HARNESS-DSL-v1, ADR-009-nlah-runtime-replaces-state-graph]

harness:
  name: CODING_ADAPTER
  task_family: repository_issue_resolution
  objective: >
    Resolve a repository-grounded issue by producing a patch,
    independent verification, and a PR-ready summary.

runtime:
  state_root: state
  artifact_root: artifacts
  graph_mode: linear
  default_failure_action: abort

roles:
  Cartographer:
    responsibility: Map relevant files, tests, dependencies. Must not edit files.
  PatchWorker:
    responsibility: Produce one candidate patch from issue contract and repo map.
  Verifier:
    responsibility: Independently evaluate candidate patch. Must not repair patch.
  ReleaseAgent:
    responsibility: Produce final patch, evidence, and PR-ready summary.

artifacts:
  IssueContract:
    path: artifacts/issue_contract.md
    required: true
    contract:
      kind: text
      required_patterns:
        - "Issue:"
        - "Acceptance:"
  RepoMap:
    path: artifacts/repo_map.md
    required: true
    contract:
      kind: text
      required_patterns:
        - "## Relevant files"
        - "src/coding-adapter-smoke.ts"
        - "## Test entrypoints"
        - "pnpm --filter @factory/ff-pipeline test"
  CandidatePatch:
    path: artifacts/candidate.patch
    required: true
    contract:
      kind: text
      required_patterns:
        - "diff --git a/src/coding-adapter-smoke.ts b/src/coding-adapter-smoke.ts"
        - "--- /dev/null"
        - "\\+\\+\\+ b/src/coding-adapter-smoke.ts"
        - "@@ -0,0 \\+1 @@"
        - "\\+coding-adapter smoke"
  VerifierReport:
    path: artifacts/verifier_report.md
    required: true
    contract:
      kind: text
      required_patterns:
        - "Verdict: PASS"
        - "Tests run"
        - "pnpm --filter @factory/ff-pipeline test"
  FinalPatch:
    path: artifacts/final.patch
    required: true
    contract:
      kind: text
      required_patterns:
        - "diff --git a/src/coding-adapter-smoke.ts b/src/coding-adapter-smoke.ts"
        - "--- /dev/null"
        - "\\+\\+\\+ b/src/coding-adapter-smoke.ts"
        - "@@ -0,0 \\+1 @@"
        - "\\+coding-adapter smoke"
  PRSummary:
    path: artifacts/pr_summary.md
    required: true
    contract:
      kind: text
      required_patterns:
        - "Summary:"
        - "Tests:"

stages:
  CONTRACT:
    from: TaskReceived
    to: IssueContracted
    role: Cartographer
    worker: pi
    inputs: []
    outputs: [IssueContract]
    gate:
      all: [{ exists: IssueContract }]

  MAP:
    from: IssueContracted
    to: RepoMapped
    role: Cartographer
    worker: pi
    inputs: [IssueContract]
    outputs: [RepoMap]
    gate:
      all:
        - { exists: RepoMap }
        - repo_map_names_relevant_files
        - repo_map_names_test_entrypoints

  PATCH:
    from: RepoMapped
    to: PatchCandidate
    role: PatchWorker
    worker: pi
    inputs: [RepoMap]
    outputs: [CandidatePatch]
    gate:
      all:
        - { exists: CandidatePatch }
        - { patch_applies_cleanly: CandidatePatch }

  VERIFY:
    from: PatchCandidate
    to: VerifiedPatch
    role: Verifier
    worker: pi
    inputs: [CandidatePatch]
    outputs: [VerifierReport]
    gate:
      all:
        - { exists: VerifierReport }
        - verifier_accepts_patch
        - test_results_support_claims

  RELEASE:
    from: VerifiedPatch
    to: PullRequestReady
    role: ReleaseAgent
    worker: pi
    inputs: [CandidatePatch, VerifierReport]
    outputs: [FinalPatch, PRSummary]
    gate:
      all:
        - { exists: FinalPatch }
        - { exists: PRSummary }
        - final_patch_matches_verified_candidate

failure_taxonomy:
  missing_artifact:     retry_stage
  patch_does_not_apply: return_to_stage
  verifier_rejects:     return_to_stage
  budget_exceeded:      mark_incomplete
